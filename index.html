    <title>Codey - Programando Aventuras</title>

    <!-- Aplica o tema salvo ANTES do primeiro desenho da tela (evita piscar claro→escuro). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("codey_theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Fontes: antes vinham por @import dentro do CSS (cadeia bloqueante CSS → CSS do Google → fonte).
         Agora a conexão é aberta em paralelo, logo no início. -->
